[genesyscloud_audit_change]
search = sourcetype="genesyscloud:operational:audits"

[genesyscloud_audit_account]
search = sourcetype="genesyscloud:operational:audits" (entity_type="User" OR entityType="User")

[genesyscloud_edge_performance]
search = sourcetype="genesyscloud:telephonyprovidersedge:edges:metrics"

[genesyscloud_edge_storage]
search = sourcetype="genesyscloud:telephonyprovidersedge:edges:metrics" disks_total_bytes>0
