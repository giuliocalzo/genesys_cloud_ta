[genesyscloud:analytics:conversations:details]
TRUNCATE = 0

# CIM: Change (All_Changes, Account_Management).
# Events are snake_case when the SDK returns model objects and camelCase when the
# audit results are downloaded from a URL, so every mapping reads both shapes.
[genesyscloud:operational:audits]
KV_MODE = json
EVAL-vendor = "Genesys"
EVAL-product = "Genesys Cloud"
EVAL-vendor_product = "Genesys Cloud"
EVAL-dvc = "Genesys Cloud"
EVAL-command = action
EVAL-action = case(lower(action)=="create", "created", lower(action)=="update", "updated", in(lower(action), "delete", "purge"), "deleted", in(lower(action), "read", "view", "download", "export"), "read", in(lower(action), "add", "remove", "move", "archive", "unarchive", "restore", "rotate", "changepassword", "authorize", "deauthorize", "revoke"), "modified", isnotnull(action), lower(action))
EVAL-status = case(upper(status)=="SUCCESS", "success", upper(status)=="FAILURE", "failure", upper(status)=="WARNING", "success", isnotnull(status), lower(status))
EVAL-result = if(upper(status)=="WARNING", "warning", 'message.message')
EVAL-change_type = coalesce(service_name, serviceName)
EVAL-object = coalesce('entity.name', 'entity.id')
FIELDALIAS-object_id = "entity.id" AS object_id
EVAL-object_category = lower(coalesce(entity_type, entityType))
EVAL-object_attrs = coalesce('property_changes{}.property', 'propertyChanges{}.property')
EVAL-user = if(lower(coalesce(entity_type, entityType))=="user", coalesce('entity.name', 'entity.id'), coalesce('user.name', 'user.id'))
FIELDALIAS-user_id = "user.id" AS user_id
FIELDALIAS-user_type = level AS user_type
EVAL-src_user = if(lower(coalesce(entity_type, entityType))=="user", coalesce('user.name', 'user.id'), null())
EVAL-src_user_name = if(lower(coalesce(entity_type, entityType))=="user", 'user.name', null())
EVAL-src = coalesce('remote_ip{}', 'remoteIp{}')
EVAL-dest = coalesce(user_home_org_id, userHomeOrgId)
EVAL-vendor_account = coalesce(user_home_org_id, userHomeOrgId)

# CIM: Performance (CPU, Memory, Storage, OS, Uptime). Sizes are reported in MB.
[genesyscloud:telephonyprovidersedge:edges:metrics]
KV_MODE = json
EVAL-vendor_product = "Genesys Cloud"
EVAL-dest = coalesce('edge.name', 'edge.id')
EVAL-resource_type = "system"
EVAL-signature = "edge_metrics"
EVAL-cpu_load_percent = mvindex('processors{}.active_time_pct', mvfind('processors{}.cpu_id', "^total$"))
EVAL-cpu_user_percent = mvindex('processors{}.user_time_pct', mvfind('processors{}.cpu_id', "^total$"))
EVAL-mem = round(tonumber(mvindex('memory{}.total_bytes', mvfind('memory{}.type', "^physical$"))) / 1048576, 2)
EVAL-mem_free = round(tonumber(mvindex('memory{}.available_bytes', mvfind('memory{}.type', "^physical$"))) / 1048576, 2)
EVAL-mem_used = round((tonumber(mvindex('memory{}.total_bytes', mvfind('memory{}.type', "^physical$"))) - tonumber(mvindex('memory{}.available_bytes', mvfind('memory{}.type', "^physical$")))) / 1048576, 2)
EVAL-uptime = round(up_time_msec / 1000)
EVAL-storage = if(disks_total_bytes > 0, round(disks_total_bytes / 1048576, 2), null())
EVAL-storage_free = if(disks_total_bytes > 0, round(disks_available_bytes / 1048576, 2), null())
EVAL-storage_used = if(disks_total_bytes > 0, round((disks_total_bytes - disks_available_bytes) / 1048576, 2), null())
EVAL-storage_free_percent = if(disks_total_bytes > 0, round(disks_available_bytes / disks_total_bytes * 100, 2), null())
EVAL-storage_used_percent = if(disks_total_bytes > 0, round((disks_total_bytes - disks_available_bytes) / disks_total_bytes * 100, 2), null())
